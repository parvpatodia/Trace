[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace"
version = "0.1.0"
description = "Curiosity inference newsletter agent"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "anthropic>=0.28,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.2,<1.0",
    "apify-client>=1.7,<2.0",
    "praw>=7.7,<8.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers>=3.0,<4.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pymupdf>=1.24,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6.100,<7.0",
    "respx>=0.21,<1.0",
]

dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=trace",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]
markers = [
    "unit: fast, no external I/O",
    "integration: requires real API keys, skipped in CI",
    "smoke: full pipeline with mocks",
]
filterwarnings = [
    # PyMuPDF SWIG C-extension bindings emit these on import — not our code.
    "ignore::DeprecationWarning:importlib",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "trace/pipeline/nodes.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
